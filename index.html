
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .signup-container {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 2rem;
      font-weight: 600;
      color: #5d5fef;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #f7f8ff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #5d5fef;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(93, 95, 239, 0.2);
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #5d5fef, #7c7eff);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(93, 95, 239, 0.4);
    }

    .success {
      display: none;
      margin-top: 20px;
      color: #2ecc71;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <div class="logo">Create Account</div>
    <div class="subtitle">Join us and start your journey 🚀</div>

    <form id="signupForm">
      <input type="text" id="signupName" placeholder="Full Name" required>
      <input type="tel" id="signupPhone" placeholder="Phone Number" required pattern="[0-9]{10,11}">
      <input type="email" id="signupEmail" placeholder="Email Address" required>
      <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" minlength="6" required>

      <button type="submit">Sign Up</button>
    </form>

    <div class="success" id="signupSuccess">
      ✅ Account created successfully
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const userData = {
        name: signupName.value.trim(),
        phone: signupPhone.value.trim(),
        email: signupEmail.value.trim()
      };

      localStorage.setItem('user_data', JSON.stringify(userData));

      document.getElementById('signupSuccess').style.display = 'block';
      this.reset();
    });
  </script>

</body>
</html>
